  <!-- ૧. ફુલ-વિડ્થ ટોપબાર હેડર (Full-Width Sacred Sticky Header with Vector SVG Icons) -->

          <span>વેબસાઈટ જુઓ</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
        <button class="admin-top-logout-btn" id="topLogoutBtn" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>બહાર નીકળો</span>

  <!-- ૨. મુખ્ય ફુલ-સ્ક્રીન કન્ટેનર (Full-Width Main Container) -->
  <main class="admin-full-main" id="adminMainArea">
    <!-- Rendered dynamically by StandaloneAdmin -->
  </main>

  <!-- ૩. ટોસ્ટ નોટિફિકેશન કન્ટેનર -->

  <!-- ૪. ક્વિક પેમ્ફ્લેટ પ્રીવ્યૂ મોડલ (Devotee Pamphlet Preview Modal) -->
  <div class="modal-overlay" id="previewModalOverlay" style="display: none; position: fixed; inset: 0; background: rgba(50, 10, 5, 0.75); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 1rem;">
    <div style="background: #FFFFFF; border: 2px solid #EAD8C2; border-radius: 20px; max-width: 740px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.75rem; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.35);">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #FEF3C7; padding-bottom: 0.75rem; margin-bottom: 1.25rem;">
        <h3 id="previewModalTitle" style="font-size: 1.35rem; color: #8B1E0F; margin: 0; font-weight: 800; display: flex; align-items: center; gap: 0.5rem;"></h3>
        <button type="button" id="closePreviewBtn" style="background: #FFFDF9; border: 1.5px solid #E2D0BA; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; color: #8B1E0F; display: flex; align-items: center; justify-content: center;" title="બંધ કરો">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

  <!-- ૫. ફુલ-વિડ્થ ફૂટર (Footer) -->
  <footer class="admin-full-footer">
    <div style="display: flex; align-items: center; justify-content: center; gap: 0.65rem; margin-bottom: 0.4rem;">
      <div class="sacred-logo-ring" style="width: 28px; height: 28px; box-shadow: none; padding: 1.5px;">
        <img src="assets/icons/gemini-svg.svg" alt="શાસ્ત્રીજી ॐ લોગો" class="sacred-logo-img">
      </div>
      <div style="font-weight: 700; color: #8B1E0F; font-size: 0.95rem;">
        શાસ્ત્રીજી જીતેન્દ્ર જોષી પૂજા પોર્ટફોલિયો CMS
      </div>
    </div>
    <div style="color: #6B5446; display: flex; align-items: center; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
      <span>© 2026 શાસ્ત્રીજી જીતેન્દ્ર જોષી. સર્વાધિકાર સુરક્ષિત.</span>
      <span>•</span>
      <span style="display: inline-flex; align-items: center; gap: 0.25rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        <span>મો. ૯૯૨૫૨ ૬૪૯૨૯</span>
      </span>
      <span>•</span>
      <span style="display: inline-flex; align-items: center; gap: 0.25rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span>ગુજરાત, ભારત</span>
      </span>
    </div>
  </footer>

  <!-- ૬. મોડ્યુલર જાવાસ્ક્રિપ્ટ લોજિક (Full UI/UX Pro Max Logic) -->
  <script type="module">
    import { db, apiFetch, getApiBaseUrl, DEITY_GALLERY, resolveDeityImage, detectDeity, generateDeityImageFromTitle, renderSacredCanvasCard } from './js/db.js';
    import { CATEGORIES, DEFAULT_COMMON_SAMAGRI, toGujaratiNumber } from './js/data.js';
    import { ICONS } from './js/icons.js';
    import { mountCardGenerator } from './js/card-generator.js';
    import { openScannerModal } from './js/image-scanner.js';

    class StandaloneAdmin {
      constructor() {
        this.isAuthenticated = false;
        this.mainContainer = document.getElementById('adminMainArea');
        this.activeTab = 'services'; // 'services', 'add', 'profile', 'pin'
        this.editingService = null;
        this.searchQuery = '';
        this.categoryFilter = 'બધા વિભાગો';
        this.cachedServices = [];
        this.currentPage = 1;
        this.itemsPerPage = 10;
      }

      async init() {
        this.checkServerStatus();

        if (sessionStorage.getItem('shastriji_admin_auth') === 'true') {
          this.isAuthenticated = true;
          document.getElementById('topLogoutBtn').style.display = 'inline-flex';
          document.getElementById('topLogoutBtn').onclick = () => this.logout();
          await this.renderDashboard();
        } else {
          this.renderPinScreen();
        }

        // Preview modal close handler
        const closeBtn = document.getElementById('closePreviewBtn');
        const overlay = document.getElementById('previewModalOverlay');
        if (closeBtn && overlay) {
          closeBtn.onclick = () => { overlay.style.display = 'none'; };
          overlay.onclick = (e) => { if (e.target === overlay) overlay.style.display = 'none'; };
        }
      }

      async checkServerStatus() {
        const pillText = document.getElementById('adminServerStatusText');
        try {
          const res = await apiFetch(`/api/status?t=${Date.now()}`, { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            if (pillText) pillText.textContent = `લાઈવ સર્વર (${data.servicesCount || 'ડેટા'} સક્રિય)`;
          } else {
            if (pillText) pillText.textContent = 'સ્થાનિક સ્ટોરેજ સક્રિય';
          }
        } catch {
          if (pillText) pillText.textContent = 'સ્થાનિક સ્ટોરેજ સક્રિય';
        }
      }

      showToast(message) {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<span style="display: inline-flex;">${ICONS.check}</span> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      }

      logout() {
        this.isAuthenticated = false;
        sessionStorage.removeItem('shastriji_admin_auth');
        document.getElementById('topLogoutBtn').style.display = 'none';
        this.showToast('આપ સફળતાપૂર્વક લૉગ આઉટ થયા છો.');
        this.renderPinScreen();
      }

      /* -------------------------------------------------------------
         ૧. પિન લૉગિન સ્ક્રીન (Sacred PIN Authentication Screen with SVG Logo)
         ------------------------------------------------------------- */
      renderPinScreen() {
        this.mainContainer.innerHTML = `
          <div class="admin-pin-view-wrapper">
            <div class="admin-pin-card">
              <div class="sacred-logo-ring admin-pin-logo-ring">
                <img src="assets/icons/gemini-svg.svg" alt="શાસ્ત્રીજી ॐ લોગો" class="sacred-logo-img">
              </div>
              <h2 class="admin-pin-title">શાસ્ત્રીજી સુરક્ષિત લૉગિન</h2>
              <p class="admin-pin-sub">કૃપા કરીને આપનો ૪-અંકનો ગુપ્ત પિન દાખલ કરો</p>

              <div class="admin-pin-boxes-row">
                <input type="password" maxlength="1" class="admin-pin-digit-input" id="pinDigit1" autofocus autocomplete="off" inputmode="numeric" aria-label="પિન અંક ૧">
                <input type="password" maxlength="1" class="admin-pin-digit-input" id="pinDigit2" autocomplete="off" inputmode="numeric" aria-label="પિન અંક ૨">
                <input type="password" maxlength="1" class="admin-pin-digit-input" id="pinDigit3" autocomplete="off" inputmode="numeric" aria-label="પિન અંક ૩">
                <input type="password" maxlength="1" class="admin-pin-digit-input" id="pinDigit4" autocomplete="off" inputmode="numeric" aria-label="પિન અંક ૪">
              </div>

              <div class="admin-pin-error" id="pinErrorMsg"></div>

              <button class="admin-pin-submit-btn" id="pinSubmitBtn" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                ${ICONS.lock}
                <span>પ્રવેશ કરો</span>
                ${ICONS.arrowRight}
              </button>

              <div style="margin-top: 1.35rem;">
                <span class="admin-pin-hint-tag" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                  ${ICONS.shield}
                  <span>મૂળભૂત સુરક્ષા પિન: <strong>1234</strong> (લૉગિન પછી બદલી શકાય છે)</span>
                </span>
              </div>
            </div>
          </div>
        `;

        const digits = [
          document.getElementById('pinDigit1'),
          document.getElementById('pinDigit2'),
          document.getElementById('pinDigit3'),
          document.getElementById('pinDigit4')
        ];

        digits.forEach((input, index) => {
          input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && index < 3) {
              digits[index + 1].focus();
            }
            if (digits.every(d => d.value.length === 1)) {
              this.verifyPin(digits.map(d => d.value).join(''));
            }
          });

          input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && index > 0) {
              digits[index - 1].focus();
            }
          });

          // Paste support (e.g. pasting "1234")
          input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = (e.clipboardData || window.clipboardData).getData('text').trim();
            if (pastedData.length >= 4) {
              digits.forEach((d, i) => { if (d) d.value = pastedData[i] || ''; });
              this.verifyPin(digits.map(d => d.value).join(''));
            }
          });
        });

        document.getElementById('pinSubmitBtn')?.addEventListener('click', () => {
          const pin = digits.map(d => d.value).join('');
          this.verifyPin(pin);
        });
      }

      async verifyPin(enteredPin) {
        const errorEl = document.getElementById('pinErrorMsg');
        const profile = await db.getProfile();
        const correctPin = profile.pin || '1234';

        if (enteredPin === correctPin) {
          this.isAuthenticated = true;
          sessionStorage.setItem('shastriji_admin_auth', 'true');
          document.getElementById('topLogoutBtn').style.display = 'inline-flex';
          document.getElementById('topLogoutBtn').onclick = () => this.logout();
          this.showToast('સ્વાગત છે શાસ્ત્રીજી! લૉગિન સફળ રહ્યું.');
          await this.renderDashboard();
        } else {
          if (errorEl) {
            errorEl.innerHTML = `<span>ખોટો પિન! કૃપા કરીને ફરી પ્રયાસ કરો.</span>`;
          }
          const digits = ['pinDigit1', 'pinDigit2', 'pinDigit3', 'pinDigit4'].map(id => document.getElementById(id));
          digits.forEach(d => { if (d) d.value = ''; });
          if (digits[0]) digits[0].focus();
        }
      }

      /* -------------------------------------------------------------
         ૨. મુખ્ય ડેશબોર્ડ શેલ (Metrics Ribbon, Tabs, Workspace with SVG Icons)
         ------------------------------------------------------------- */
      async renderDashboard() {
        this.cachedServices = await db.getServices();

        // Calculate metrics
        const totalServices = this.cachedServices.length;
        const uniqueCategories = new Set(this.cachedServices.map(s => s.category)).size;
        const totalItemsCount = this.cachedServices.reduce((acc, s) => {
          const items = (s.pujapo || '').split(/[,;\n]+/).filter(Boolean).length;
          return acc + items;
        }, 0);

        this.mainContainer.innerHTML = `
          <!-- ટોપ મેટ્રિક્સ રિબન (Top Metrics Ribbon with SVG Icons) -->
          <div class="admin-metrics-ribbon">
            <div class="admin-metric-card">
              <div class="admin-metric-icon" style="color: #8B1E0F;">
                ${ICONS.diya}
              </div>
              <div>
                <div class="admin-metric-value">${totalServices} પૂજાઓ</div>
                <div class="admin-metric-label">કુલ સક્રિય યાદી</div>
              </div>
            </div>

            <div class="admin-metric-card">
              <div class="admin-metric-icon" style="color: #D97706;">
                ${ICONS.tag}
              </div>
              <div>
                <div class="admin-metric-value">${uniqueCategories} શ્રેણીઓ</div>
                <div class="admin-metric-label">કર્મકાંડ, શાંતિ, વ્રત</div>
              </div>
            </div>

            <div class="admin-metric-card">
              <div class="admin-metric-icon" style="color: #15803D;">
                ${ICONS.scroll}
              </div>
              <div>
                <div class="admin-metric-value">${totalItemsCount}+ વસ્તુઓ</div>
                <div class="admin-metric-label">શાસ્ત્રોક્ત સામગ્રી લિસ્ટ</div>
              </div>
            </div>

            <div class="admin-metric-card">
              <div class="admin-metric-icon" style="color: #8B1E0F;">
                ${ICONS.shield}
              </div>
              <div>
                <div class="admin-metric-value">૧૦૦% સુરક્ષિત</div>
                <div class="admin-metric-label">સર્વર + ઑટો-બેકઅપ</div>
              </div>
            </div>
          </div>

          <!-- નેવિગેશન ટેબ્સ બાર (Sleek Tabs with Vector SVG Icons) -->
          <div class="admin-tabs-nav-bar">
            <button class="admin-tab-nav-btn ${this.activeTab === 'services' ? 'active' : ''}" id="tabServicesBtn">
              ${ICONS.list}
              <span>બધી પૂજાઓ (${totalServices})</span>
            </button>
            <button class="admin-tab-nav-btn ${this.activeTab === 'add' ? 'active' : ''}" id="tabAddBtn">
              ${ICONS.plus}
              <span>નવી પૂજા ઉમેરો</span>
            </button>
            <button class="admin-tab-nav-btn ${this.activeTab === 'profile' ? 'active' : ''}" id="tabProfileBtn">
              ${ICONS.user}
              <span>શાસ્ત્રીજી પ્રોફાઈલ</span>
            </button>
            <button class="admin-tab-nav-btn ${this.activeTab === 'pin' ? 'active' : ''}" id="tabPinBtn">
              ${ICONS.key}
              <span>સુરક્ષા પિન બદલો</span>
            </button>
          </div>

          <!-- વર્કસ્પેસ કન્ટેન્ટ એરિયા -->
          <div id="adminWorkspace"></div>
        `;

        // Wire Tab Clicks
        document.getElementById('tabServicesBtn')?.addEventListener('click', () => {
          this.activeTab = 'services';
          this.editingService = null;
          this.updateTabStyles();
          this.renderServicesView();
        });

        document.getElementById('tabAddBtn')?.addEventListener('click', () => {
          this.activeTab = 'add';
          this.editingService = null;
          this.updateTabStyles();
          this.renderAddEditView(null);
        });

        document.getElementById('tabProfileBtn')?.addEventListener('click', () => {
          this.activeTab = 'profile';
          this.updateTabStyles();
          this.renderProfileView();
        });

        document.getElementById('tabPinBtn')?.addEventListener('click', () => {
          this.activeTab = 'pin';
          this.updateTabStyles();
          this.renderPinChangeView();
        });

        // Initial view load
        if (this.activeTab === 'services') {
          await this.renderServicesView();
        } else if (this.activeTab === 'add') {
          await this.renderAddEditView(this.editingService);
        } else if (this.activeTab === 'profile') {
          await this.renderProfileView();
        } else if (this.activeTab === 'pin') {
          await this.renderPinChangeView();
        }
      }

      updateTabStyles() {
        const btnMap = {
          services: 'tabServicesBtn',
          add: 'tabAddBtn',
          profile: 'tabProfileBtn',
          pin: 'tabPinBtn'
        };
        Object.entries(btnMap).forEach(([tab, btnId]) => {
          const btn = document.getElementById(btnId);
          if (btn) {
            if (this.activeTab === tab) btn.classList.add('active');
            else btn.classList.remove('active');
          }
        });
      }

      /* -------------------------------------------------------------
         ૩. "બધી પૂજાઓ" વ્યુ (All Services View - Full Responsive Grid with SVG Icons)
         ------------------------------------------------------------- */
      async renderServicesView() {
        const workspace = document.getElementById('adminWorkspace');
        if (!workspace) return;

        this.cachedServices = await db.getServices();

        // Unique categories for filter dropdown
        const categories = ['બધા વિભાગો', ...new Set(this.cachedServices.map(s => s.category).filter(Boolean))];
        const catOptions = categories
          .map(cat => `<option value="${cat}" ${this.categoryFilter === cat ? 'selected' : ''}>${cat}</option>`)
          .join('');

        // Apply filters
        const filtered = this.cachedServices.filter(s => {
          const matchesCategory = (this.categoryFilter === 'બધા વિભાગો') || (s.category === this.categoryFilter);
          const q = this.searchQuery.toLowerCase().trim();
          if (!q) return matchesCategory;

          const title = (s.title || '').toLowerCase();
          const engTitle = (s.englishTitle || '').toLowerCase();
          const pujapo = (s.pujapo || '').toLowerCase();
          const keywords = Array.isArray(s.keywords) ? s.keywords.join(' ').toLowerCase() : '';

          const matchesQuery = title.includes(q) || engTitle.includes(q) || pujapo.includes(q) || keywords.includes(q);
          return matchesCategory && matchesQuery;
        });

        // Pagination calculations
        const totalFiltered = filtered.length;
        const effectivePerPage = this.itemsPerPage === 'all' ? totalFiltered : parseInt(this.itemsPerPage, 10);
        const totalPages = Math.max(1, Math.ceil(totalFiltered / effectivePerPage));

        if (this.currentPage > totalPages) this.currentPage = totalPages;
        if (this.currentPage < 1) this.currentPage = 1;

        const startIndex = (this.currentPage - 1) * effectivePerPage;
        const endIndex = Math.min(startIndex + effectivePerPage, totalFiltered);
        const paginated = filtered.slice(startIndex, endIndex);

        let gridHtml = '';

        if (totalFiltered === 0) {
          gridHtml = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 3.5rem 1.5rem; background: #FFFFFF; border: 1.5px dashed #EAD8C2; border-radius: 18px;">
              <div style="font-size: 2.5rem; color: #D97706; margin-bottom: 0.75rem;">
                ${ICONS.search}
              </div>
              <h3 style="font-size: 1.3rem; color: #8B1E0F; margin-bottom: 0.35rem;">કોઈ પૂજા મળી નહીં</h3>
              <p style="color: #6B5446; font-size: 0.95rem; margin-bottom: 1.25rem;">
                ${this.searchQuery ? `"${this.searchQuery}" માટે કોઈ પરિણામ મળ્યું નથી.` : 'હજી કોઈ પૂજા ઉમેરેલ નથી.'}
              </p>
              <button class="admin-btn-primary" id="emptyAddNewBtn" style="margin: 0 auto;">
                ${ICONS.plus}
                <span>નવી પૂજા ઉમેરો</span>
              </button>
            </div>
          `;
        } else {
          gridHtml = paginated.map(item => {
            const samagriCount = (item.pujapo || '').split(/[,;\n]+/).filter(Boolean).length;
            const thumb = item.thumbnailUrl || resolveDeityImage(item.title, item.category);
            const price = item.price || 'દક્ષિણા માટે સંપર્ક કરો';
            const badge = item.badge || 'ધાર્મિક વિધિ';
            const engTitle = item.englishTitle || '';

            return `
              <div class="admin-srv-card-new">
                <div class="admin-srv-card-top">
                  <div class="admin-srv-thumb-box">
                    <img src="${thumb}" alt="${item.title}" class="admin-srv-thumb-img" onerror="this.src='assets/icons/gemini-svg.svg'">
                  </div>

                  <div class="admin-srv-meta-col">
                    <div class="admin-srv-tags-row">
                      <span class="admin-tag-category" style="display: inline-flex; align-items: center; gap: 0.3rem;">
                        ${ICONS.tag}
                        <span>${item.category}</span>
                      </span>
                      <span class="admin-tag-badge" style="display: inline-flex; align-items: center; gap: 0.25rem;">
                        ${ICONS.star}
                        <span>${badge}</span>
                      </span>
                    </div>
                    <div class="admin-srv-title-text">${item.title}</div>
                    ${engTitle ? `<div class="admin-srv-english-text">${engTitle}</div>` : ''}
                    <div class="admin-srv-price-text">
                      ${ICONS.coin}
                      <span>${price}</span>
                    </div>
                  </div>
                </div>

                <div class="admin-srv-card-middle">
                  <div class="admin-srv-samagri-count">
                    ${ICONS.list}
                    <span>શાસ્ત્રોક્ત સામગ્રી: ${samagriCount} વસ્તુઓ</span>
                  </div>
                  <div style="font-size: 0.82rem; color: #8C7A6B; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                    ${item.pujapo ? item.pujapo : 'સામગ્રી વિગત ઉપલબ્ધ નથી.'}
                  </div>
                </div>

                <div class="admin-srv-card-actions">
                  <button class="admin-action-btn-edit edit-srv-btn" data-id="${item.id}" title="આ પૂજામાં ફેરફાર કરો">
                    ${ICONS.edit}
                    <span>સુધારો</span>
                  </button>

                  <button class="admin-btn-secondary preview-srv-btn" data-id="${item.id}" style="min-height: 40px; padding: 0.4rem 0.85rem; font-size: 0.88rem;" title="પેમ્ફ્લેટ પ્રીવ્યૂ જુઓ">
                    ${ICONS.preview}
                    <span>પ્રીવ્યૂ</span>
                  </button>

                  <button class="admin-action-btn-del del-srv-btn" data-id="${item.id}" title="આ પૂજા કાઢી નાખો">
                    ${ICONS.trash}
                    <span>કાઢી નાખો</span>
                  </button>
                </div>
              </div>
            `;
          }).join('');
        }

        // Build pagination HTML
        let paginationHtml = '';
        if (totalFiltered > 0) {
          const startNum = toGujaratiNumber(startIndex + 1);
          const endNum = toGujaratiNumber(endIndex);
          const totalNum = toGujaratiNumber(totalFiltered);
          const currentPageNum = toGujaratiNumber(this.currentPage);
          const totalPagesNum = toGujaratiNumber(totalPages);

          let pages = [];
          if (totalPages <= 6) {
            for (let i = 1; i <= totalPages; i++) pages.push(i);
          } else {
            if (this.currentPage <= 3) {
              pages = [1, 2, 3, 4, '...', totalPages];
            } else if (this.currentPage >= totalPages - 2) {
              pages = [1, '...', totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
            } else {
              pages = [1, '...', this.currentPage - 1, this.currentPage, this.currentPage + 1, '...', totalPages];
            }
          }

          const numbersHtml = pages.map(p => {
            if (p === '...') {
              return `<span class="pagination-ellipsis" aria-hidden="true">…</span>`;
            }
            const isActive = p === this.currentPage;
            return `
              <button type="button" class="pagination-btn ${isActive ? 'active' : ''}" data-page="${p}" aria-label="પેજ ${toGujaratiNumber(p)}" ${isActive ? 'aria-current="page"' : ''}>
                ${toGujaratiNumber(p)}
              </button>
            `;
          }).join('');

          const isFirstPage = this.currentPage <= 1;
          const isLastPage = this.currentPage >= totalPages;

          paginationHtml = `
            <div class="admin-pagination-container">
              <nav class="sacred-pagination-bar" aria-label="એડમિન પૂજા સેવાઓ પેજીનેશન નેવિગેશન">
                <div class="pagination-meta-info">
                  <span>કુલ <strong>${totalNum}</strong> પૂજાઓમાંથી <strong>${startNum}</strong> થી <strong>${endNum}</strong></span>
                  <span class="pagination-page-badge">પેજ ${currentPageNum} / ${totalPagesNum}</span>
                </div>

                ${totalPages > 1 ? `
                  <div class="pagination-controls-row">
                    <button type="button" class="pagination-btn pagination-btn-nav" data-page="1" title="પ્રથમ પેજ" aria-label="પ્રથમ પેજ" ${isFirstPage ? 'disabled' : ''}>
                      ${ICONS.chevronsLeft}
                      <span class="pagination-btn-label">પ્રથમ</span>
                    </button>

                    <button type="button" class="pagination-btn pagination-btn-nav" data-page="${this.currentPage - 1}" title="અગાઉનું પેજ" aria-label="અગાઉનું પેજ" ${isFirstPage ? 'disabled' : ''}>
                      ${ICONS.arrowLeft}
                      <span class="pagination-btn-label">અગાઉ</span>
                    </button>

                    <div class="pagination-numbers-wrap">
                      ${numbersHtml}
                    </div>

                    <button type="button" class="pagination-btn pagination-btn-nav" data-page="${this.currentPage + 1}" title="આગળનું પેજ" aria-label="આગળનું પેજ" ${isLastPage ? 'disabled' : ''}>
                      <span class="pagination-btn-label">આગળ</span>
                      ${ICONS.arrowRight}
                    </button>

                    <button type="button" class="pagination-btn pagination-btn-nav" data-page="${totalPages}" title="છેલ્લું પેજ" aria-label="છેલ્લું પેજ" ${isLastPage ? 'disabled' : ''}>
                      <span class="pagination-btn-label">છેલ્લું</span>
                      ${ICONS.chevronsRight}
                    </button>
                  </div>
                ` : ''}

                <div class="pagination-per-page-wrap">
                  <label for="adminPerPageSelect" class="pagination-per-page-label">પ્રતિ પેજ:</label>
                  <select id="adminPerPageSelect" class="pagination-per-page-select" aria-label="પ્રતિ પેજ પૂજાઓની સંખ્યા પસંદ કરો">
                    <option value="6" ${this.itemsPerPage === 6 || this.itemsPerPage === '6' ? 'selected' : ''}>૬ પૂજાઓ (ટેસ્ટ)</option>
                    <option value="10" ${this.itemsPerPage === 10 || this.itemsPerPage === '10' ? 'selected' : ''}>૧૦ પૂજાઓ</option>
                    <option value="15" ${this.itemsPerPage === 15 || this.itemsPerPage === '15' ? 'selected' : ''}>૧૫ પૂજાઓ</option>
                    <option value="25" ${this.itemsPerPage === 25 || this.itemsPerPage === '25' ? 'selected' : ''}>૨૫ પૂજાઓ</option>
                    <option value="all" ${this.itemsPerPage === 'all' ? 'selected' : ''}>બધી પૂજાઓ</option>
                  </select>
                </div>
              </nav>
            </div>
          `;
        }

        workspace.innerHTML = `
          <!-- કંટ્રોલ બાર (Live Search, Category Filter, Add CTA with SVG Icons) -->
          <div class="admin-view-header-bar">
            <div class="admin-search-box-wrap">
              ${ICONS.search}
              <input type="text" class="admin-search-box-input" id="adminSearchInput" value="${this.searchQuery}" placeholder="પૂજાનું નામ, અંગ્રેજી કીવર્ડ (દા.ત. Satyanarayan, Vastu) કે સામગ્રી શોધો...">
            </div>

            <select class="admin-filter-select" id="adminCategorySelect">
              ${catOptions}
            </select>

            <button class="admin-btn-primary" id="addNewServiceTopBtn">
              ${ICONS.plus}
              <span>નવી પૂજા ઉમેરો</span>
            </button>
          </div>

          <!-- સર્વિસીસ ગ્રીડ (Full Responsive Grid) -->
          <div class="admin-services-grid">
            ${gridHtml}
          </div>

          ${paginationHtml}
        `;

        // Wire Search Input
        const searchInput = document.getElementById('adminSearchInput');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            this.searchQuery = e.target.value;
            this.currentPage = 1;
            this.renderServicesView();
            // Re-focus and preserve cursor
            const updatedInput = document.getElementById('adminSearchInput');
            if (updatedInput) {
              updatedInput.focus();
              updatedInput.setSelectionRange(updatedInput.value.length, updatedInput.value.length);
            }
          });
        }

        // Wire Category Filter
        const catSelect = document.getElementById('adminCategorySelect');
        if (catSelect) {
          catSelect.addEventListener('change', (e) => {
            this.categoryFilter = e.target.value;
            this.currentPage = 1;
            this.renderServicesView();
          });
        }

        // Wire Pagination buttons
        workspace.querySelectorAll('button[data-page]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const targetPage = parseInt(e.currentTarget.dataset.page, 10);
            if (!isNaN(targetPage) && targetPage >= 1 && targetPage <= totalPages && targetPage !== this.currentPage) {
              this.currentPage = targetPage;
              this.renderServicesView();
              workspace.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        });

        // Wire Per Page Select
        const adminPerPage = document.getElementById('adminPerPageSelect');
        if (adminPerPage) {
          adminPerPage.addEventListener('change', (e) => {
            const val = e.target.value;
            this.itemsPerPage = val === 'all' ? 'all' : parseInt(val, 10);
            this.currentPage = 1;
            this.renderServicesView();
          });
        }

        // Wire Add Button
        document.getElementById('addNewServiceTopBtn')?.addEventListener('click', () => {
          this.activeTab = 'add';
          this.editingService = null;
          this.updateTabStyles();
          this.renderAddEditView(null);
        });

        document.getElementById('emptyAddNewBtn')?.addEventListener('click', () => {
          this.activeTab = 'add';
          this.editingService = null;
          this.updateTabStyles();
          this.renderAddEditView(null);
        });

        // Wire Edit Buttons
        workspace.querySelectorAll('.edit-srv-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.currentTarget.dataset.id;
            const srv = await db.getServiceById(id);
            this.activeTab = 'add';
            this.editingService = srv;
            this.updateTabStyles();
            this.renderAddEditView(srv);
          });
        });

        // Wire Preview Buttons
        workspace.querySelectorAll('.preview-srv-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.currentTarget.dataset.id;
            const srv = await db.getServiceById(id);
            this.openPreviewModal(srv);
          });
        });

        // Wire Delete Buttons
        workspace.querySelectorAll('.del-srv-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.currentTarget.dataset.id;
            const srv = await db.getServiceById(id);
            const confirmDel = confirm(`શું આપ ખરેખર "${srv?.title || 'આ પૂજા'}" પૂજા પોર્ટફોલિયોમાંથી કાઢી નાખવા માંગો છો?`);
            if (confirmDel) {
              await db.deleteService(id);
              this.showToast('પૂજા સફળતાપૂર્વક કાઢી નાખવામાં આવી.');
              await this.renderDashboard();
            }
          });
        });
      }

         ૪. "નવી પૂજા ઉમેરો / ફેરફાર કરો" વ્યુ

                <div class="admin-form-sub-heading">

                </div>
              </div>
              <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
                <button type="button" class="admin-btn-secondary" id="fillDefaultCommonBtn" title="સામાન્ય સામગ્રી આપમેળે ભરો" style="color: #8B1E0F; border-color: #D97706;">
                  ${ICONS.refresh}
                  <span>સામાન્ય સામગ્રી રીસેટ / ભરો</span>
                </button>
                <button type="button" class="admin-btn-secondary" id="formBackToListBtn">
                  ${ICONS.arrowLeft}
                  <span>બધી પૂજાઓ પર પાછા જાઓ</span>

                  <div class="admin-scanner-desc">કાગળના પેમ્ફ્લેટ કે સામગ્રી યાદીનો ફોટો પાડી આપમેળે ફોર્મ ભરો.</div>
                </div>
              </div>
              <button type="button" class="admin-btn-secondary" id="fOpenScannerBtn" style="border-color: #8B1E0F; color: #8B1E0F; font-weight: 800;">
                ${ICONS.camera}

                    </div>

                    <div class="admin-form-group">
                      <label class="admin-form-label">બેજ (વિશેષતા)</label>
                      <input type="text" class="admin-form-input" id="fBadge" value="${initialBadge}" placeholder="ઉદાહરણ: લોકપ્રિય વિધિ / પ્રથમ પૂજ્ય દેવ">
                    </div>

                    <div class="admin-form-group">
                      <label class="admin-form-label">વિશેષ નોંધ અને શાસ્ત્રોક્ત મહત્વ</label>
                      <input type="text" class="admin-form-input" id="fNotes" value="${service?.notes || ''}" placeholder="પૂજા સંબંધિત ફળશ્રુતિ અને શાસ્ત્રોક્ત વિગત">
                    </div>
                  </div>

                  <!-- ફીલ્ડસેટ ૨: સામગ્રી અને તૈયારી લિસ્ટ (Pre-filled Defaults) -->
                  <div class="admin-fieldset-card">
                    <div style="margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;">
                      <span class="admin-fieldset-legend">
                        ${ICONS.list}
                        <span>૨. પૂજાપો, સામગ્રી અને તૈયારી લિસ્ટ</span>
                      </span>
                      <span style="font-size: 0.8rem; color: #15803D; font-weight: 700;">✓ સામાન્ય સામગ્રી પહેલેથી સામેલ છે</span>
                    </div>

                    <div class="admin-form-group">
                      <label class="admin-form-label">પૂજાપો / મુખ્ય સામગ્રી લિસ્ટ *</label>
                      <textarea class="admin-form-input" id="fPujapo" required placeholder="શ્રીફળ-૧, સોપારી-૫, કંકુ, અબીલ, ગુલાલ, સિંદૂર...">${initialPujapo}</textarea>
                      <div class="admin-form-hint">દરેક પૂજામાં ઉપયોગી સામાન્ય પૂજાપો સામેલ છે. જરૂર મુજબ આપ આમાં વધ-ઘટ કરી શકો છો.</div>
                    </div>

                    <div class="admin-form-group">
                      <label class="admin-form-label">અનાજ અને નૈવેદ્ય (પ્રસાદ)</label>
                      <textarea class="admin-form-input" id="fAnaj" placeholder="ઘઉં, ચોખા, ફળો, સાકર, મોદક, પંચામૃત...">${initialAnaj}</textarea>
                      <div class="admin-form-hint">યજમાન દ્વારા લાવવાના અનાજ, ફળ અને નૈવેદ્ય વિગત.</div>
                    </div>

                    <div class="admin-form-group">
                      <label class="admin-form-label">મૂર્તિ, વાસણ અને ઘરની તૈયારી</label>
                      <textarea class="admin-form-input" id="fTaiyari" placeholder="બાજોઠ-૧, પાટલો-૧, થાળી-૨, વાટકા-૨, તાંબાનો લોટો, ઘીનો દીવો, આસન...">${initialTaiyari}</textarea>
                      <div class="admin-form-hint">ઘરે તૈયાર રાખવાના વાસણો અને પૂજા સ્થાનની વ્યવસ્થા.</div>
                    </div>
                  </div>
                </div>

                <!-- જમણી કોલમ: ફોટો અપલોડ અને કેનવાસ કાર્ડ જનરેટર -->
                <div>
                  <div class="admin-fieldset-card">
                    <div style="margin-bottom: 1.25rem;">
                      <span class="admin-fieldset-legend">
                        ${ICONS.image}
                        <span>૩. પવિત્ર દેવ ફોટો અને કાર્ડ નિર્માણ</span>
                      </span>
                    </div>

                    <!-- ૧. પવિત્ર દેવ ફોટો પસંદ કરો (૧-ક્લિક ઓટો-મેચ ગેલેરી) -->
                    <div class="admin-form-group">
                      <label class="admin-form-label" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.25rem;">
                        <span>પવિત્ર દેવ ફોટો પસંદ કરો (૧-ક્લિક)</span>
                        <span style="font-size: 0.8rem; color: #15803D; font-weight: 700;">✓ પૂજાના નામ મુજબ આપમેળે સેટ થાય છે</span>
                      </label>
                      <div class="deity-gallery-grid" id="deityGalleryGrid">
                        ${DEITY_GALLERY.map(d => {
                          const currentThumb = service?.thumbnailUrl || '';
                          const isMatch = (currentThumb === d.url) || (!currentThumb && (service?.title ? resolveDeityImage(service.title, service.category) === d.url : d.id === 'ganesh'));
                          return `
                            <div class="deity-gallery-card ${isMatch ? 'active' : ''}" data-url="${d.url}" data-id="${d.id}" role="button" tabindex="0" title="${d.name} પસંદ કરો">
                              <img src="${d.url}" alt="${d.name}" class="deity-gallery-thumb" onerror="this.src='assets/icons/gemini-svg.svg'">
                              <div class="deity-gallery-name">${d.icon} ${d.name}</div>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>

                    <div class="admin-form-group">
                      <label class="admin-form-label">અથવા કમ્પ્યુટર / મોબાઈલમાંથી નવો ફોટો અપલોડ કરો</label>
                      
                      <!-- કસ્ટમ ફાઈલ ડ્રોપઝોન (No raw browser input) -->
                      <label for="fImageFile" class="admin-custom-file-dropzone" id="fileDropzone">
                        <div class="admin-dropzone-icon">
                          ${ICONS.upload}
                        </div>
                        <div class="admin-dropzone-title">નવો ફોટો પસંદ કરવા અહીં ક્લિક કરો</div>
                        <div class="admin-dropzone-sub">JPG, PNG, WebP ફોર્મેટ સ્વીકાર્ય છે</div>
                        <div id="selectedFileName" style="font-size: 0.85rem; color: #15803D; font-weight: 700; margin-top: 0.25rem;"></div>
                      </label>
                      <input type="file" accept="image/*" id="fImageFile" style="display: none;">
                    </div>

                    <!-- કરન્ટ ફોટો પ્રીવ્યૂ -->
                    <div id="imagePreviewBox" style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.85rem; background: #FFFDF9; padding: 0.85rem; border-radius: 12px; border: 1.5px solid #EAD8C2;">
                      <img id="imgPreviewThumb" src="${service?.thumbnailUrl || resolveDeityImage(service?.title || 'ગણેશ પૂજા', service?.category || 'ધાર્મિક પૂજા')}" style="width: 80px; height: 55px; object-fit: cover; border-radius: 8px; border: 2px solid #F59E0B;" onerror="this.src='assets/icons/gemini-svg.svg'">
                      <div>
                        <div id="imgPreviewStatus" style="font-size: 0.92rem; font-weight: 800; color: #8B1E0F; display: flex; align-items: center; gap: 0.35rem;">
                          ${ICONS.check}
                          <span>મુખ્ય ફોટો સેટ થયેલ છે</span>
                        </div>
                        <div id="imgPreviewMeta" style="font-size: 0.8rem; color: #6B5446;">સાચવવા પર આ ફોટો મુખ્ય વેબસાઈટ પર લાઈવ દેખાશે.</div>
                      </div>
                    </div>

                    <!-- દિવ્ય પૂજા કાર્ડ ઈમેજ જનરેટર (HTML5 Canvas Mount Point) -->
                    <div style="border-top: 1.5px dashed #E2D0BA; padding-top: 1.25rem; margin-top: 1rem;">
                      <div style="font-weight: 800; color: #8B1E0F; font-size: 1rem; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.45rem;">
                        <span style="color: #D97706;">${ICONS.star}</span>
                        <span>દિવ્ય પૂજા કાર્ડ ઈમેજ જનરેટર (AI વગર)</span>
                      </div>
                      <div style="font-size: 0.82rem; color: #6B5446; margin-bottom: 0.85rem;">
                        જો આપની પાસે ફોટો ન હોય, તો નીચે આપેલ કેનવાસ ટૂલથી ૧-ક્લિકમાં ઉચ્ચ ગુણવત્તાવાળું પવિત્ર કાર્ડ બનાવી સેટ કરી શકો છો.
                      </div>
                      <div id="cardGenMountPoint"></div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- ફોર્મ બોટમ એક્શન બાર -->
              <div class="admin-form-actions-bottom-bar">
                <button type="button" class="admin-btn-secondary" id="formCancelBtn">
                  ${ICONS.close}
                  <span>રદ કરો</span>
                </button>
                <button type="submit" class="admin-btn-primary" id="formSubmitBtn" style="min-height: 50px; font-size: 1.05rem; padding: 0.65rem 2rem;">
                  ${ICONS.save}
                  <span>${isEdit ? 'ફેરફાર સાચવો' : 'પૂજા સાચવો'}</span>
                </button>
              </div>
            </form>
          </div>
        `;

        // Reset / Re-fill Default Common Samagri Button
        document.getElementById('fillDefaultCommonBtn')?.addEventListener('click', () => {
          document.getElementById('fPujapo').value = DEFAULT_COMMON_SAMAGRI.pujapo;
          document.getElementById('fAnaj').value = DEFAULT_COMMON_SAMAGRI.anajNaivedya;
          document.getElementById('fTaiyari').value = DEFAULT_COMMON_SAMAGRI.taiyari;
          document.getElementById('fPrice').value = DEFAULT_COMMON_SAMAGRI.price;
          document.getElementById('fBadge').value = DEFAULT_COMMON_SAMAGRI.badge;
          this.showToast('સામાન્ય સામગ્રી ફોર્મમાં ભરાઈ ગઈ છે. આપ જરૂર મુજબ ફેરફાર કરી શકો છો.');
        });

        // Back to list button
        document.getElementById('formBackToListBtn')?.addEventListener('click', () => {
          this.activeTab = 'services';
          this.editingService = null;
          this.updateTabStyles();
          this.renderServicesView();
        });

        document.getElementById('formCancelBtn')?.addEventListener('click', () => {
          this.activeTab = 'services';
          this.editingService = null;
          this.updateTabStyles();
          this.renderServicesView();
        });

        // Deity Photo Selector Logic
        const deityCards = document.querySelectorAll('.deity-gallery-card');
        const previewThumb = document.getElementById('imgPreviewThumb');
        const previewStatus = document.getElementById('imgPreviewStatus');
        const previewMeta = document.getElementById('imgPreviewMeta');
        let selectedDeityUrl = service?.thumbnailUrl || resolveDeityImage(service?.title || 'ગણેશ પૂજા', service?.category || 'ધાર્મિક પૂજા');

        const highlightDeityCard = (url) => {
          deityCards.forEach(card => {
            if (card.dataset.url === url) {
              card.classList.add('active');
            } else {
              card.classList.remove('active');
            }
          });
        };

        deityCards.forEach(card => {
          card.addEventListener('click', () => {
            selectedDeityUrl = card.dataset.url;
            highlightDeityCard(selectedDeityUrl);
            if (previewThumb) previewThumb.src = selectedDeityUrl;
            if (previewStatus) previewStatus.innerHTML = `${ICONS.check} <span>પવિત્ર દેવ ફોટો પસંદ થયો!</span>`;
            if (previewMeta) previewMeta.textContent = 'આ ફોટો સાચવવા પર વેબસાઈટ પર દેખાશે.';
            this.showToast('પવિત્ર દેવ ફોટો પસંદ થયો!');
          });
        });

        // Custom File Upload display
        const fileInput = document.getElementById('fImageFile');
        const fileNameDisplay = document.getElementById('selectedFileName');
        const previewBox = document.getElementById('imagePreviewBox');

        let selectedGeneratedImage = null;

        if (fileInput) {
          fileInput.addEventListener('change', () => {
            if (fileInput.files && fileInput.files[0]) {
              const file = fileInput.files[0];
              if (fileNameDisplay) fileNameDisplay.textContent = `પસંદ કરેલ ફાઈલ: ${file.name}`;
              const reader = new FileReader();
              reader.onload = (e) => {
                if (previewThumb) previewThumb.src = e.target.result;
                if (previewBox) previewBox.style.display = 'flex';
                if (previewStatus) previewStatus.innerHTML = `${ICONS.check} <span>નવી ફાઈલ અપલોડ માટે તૈયાર</span>`;
                // Clear deity selection highlight
                deityCards.forEach(c => c.classList.remove('active'));
                selectedDeityUrl = null;
              };
              reader.readAsDataURL(file);
            }
          });
        }

        // Mount the Auspicious Canvas Card Generator
        const cardGenHandle = mountCardGenerator(
          document.getElementById('cardGenMountPoint'),
          {
            initialTitle: service?.title || document.getElementById('fTitle')?.value || 'પવિત્ર પૂજા વિધાન',
            initialCategory: service?.category || document.getElementById('fCategory')?.value || 'ધાર્મિક પૂજા',
            onSetImage: async (dataUrl) => {
              selectedGeneratedImage = dataUrl;
              selectedDeityUrl = null;
              deityCards.forEach(c => c.classList.remove('active'));
              if (previewThumb) previewThumb.src = dataUrl;
              if (previewBox) previewBox.style.display = 'flex';
              if (previewStatus) previewStatus.innerHTML = `${ICONS.check} <span>દિવ્ય જનરેટ કરેલ ફોટો પસંદ થયો!</span>`;
              if (fileNameDisplay) fileNameDisplay.textContent = 'કેનવાસ કાર્ડ મુખ્ય ફોટો તરીકે સેટ થયું.';
              this.showToast('દિવ્ય કાર્ડ મુખ્ય ફોટો તરીકે સેટ થઈ ગયું!');
            }
          }
        );

        // Sync Title input with live card generator & live deity image auto-generation
        const fTitleEl = document.getElementById('fTitle');
        const fCategoryEl = document.getElementById('fCategory');
        const titleBadgeEl = document.getElementById('titleAutoDeityBadge');
        let autoGenTimeout = null;

        const updateAutoDeityMatch = (isTyping = false) => {
          // If user manually uploaded a custom file or generated a custom canvas, preserve their choice
          if (fileInput.files && fileInput.files[0]) return;
          if (selectedGeneratedImage) return;

          const titleVal = fTitleEl?.value || '';
          const catVal = fCategoryEl?.value || '';

          if (isTyping && titleBadgeEl) {
            titleBadgeEl.className = 'deity-auto-gen-badge generating';
            titleBadgeEl.innerHTML = `<span>🎨 ટાઇટલ પરથી દિવ્ય ઈમેજ તૈયાર થઈ રહી છે...</span>`;
          }

          clearTimeout(autoGenTimeout);
          autoGenTimeout = setTimeout(async () => {
            const matchedDeity = detectDeity(titleVal, catVal);
            const resolvedUrl = matchedDeity?.url || 'assets/images/card-anyapooja.png';
            selectedDeityUrl = resolvedUrl;
            highlightDeityCard(resolvedUrl);

            if (previewThumb) previewThumb.src = resolvedUrl;
            if (previewStatus) {
              previewStatus.innerHTML = `${ICONS.check} <span>${matchedDeity.name}ની દિવ્ય ઈમેજ તૈયાર છે</span>`;
            }
            if (previewMeta) {
              previewMeta.textContent = `ટાઇટલ "${titleVal || 'પૂજા'}" પરથી આપમેળે પસંદ થયેલ • સેવ બટન દબાવતા જ આ ઈમેજ લાઈવ થશે.`;
            }

            if (titleBadgeEl) {
              titleBadgeEl.className = 'deity-auto-gen-badge ready';
              titleBadgeEl.innerHTML = `<span>✓ ${matchedDeity.icon} ${matchedDeity.name}ની પવિત્ર ઈમેજ આપમેળે તૈયાર થઈ ગઈ છે</span>`;
            }
          }, isTyping ? 150 : 0);
        };

        if (fTitleEl) {
          fTitleEl.addEventListener('input', (e) => {
            if (cardGenHandle) cardGenHandle.setTitle(e.target.value);
            updateAutoDeityMatch(true);
          });
        }
        if (fCategoryEl) {
          fCategoryEl.addEventListener('change', (e) => {
            if (cardGenHandle) cardGenHandle.setCategory(e.target.value);
            updateAutoDeityMatch(false);
          });
        }

        // Run initial synchronization so that form starts with image already ready
        updateAutoDeityMatch(false);

        // Wire Scanner Button
        document.getElementById('fOpenScannerBtn')?.addEventListener('click', () => {
          openScannerModal({
            onApply: (scanned) => {
              if (scanned.title) {
                fTitleEl.value = scanned.title;
                if (cardGenHandle) cardGenHandle.setTitle(scanned.title);
              }
              if (scanned.category) {
                fCategoryEl.value = scanned.category;
                if (cardGenHandle) cardGenHandle.setCategory(scanned.category);
              }
              if (scanned.price) document.getElementById('fPrice').value = scanned.price;
              if (scanned.pujapo) document.getElementById('fPujapo').value = scanned.pujapo;
              if (scanned.anajNaivedya) document.getElementById('fAnaj').value = scanned.anajNaivedya;
              if (scanned.taiyari) document.getElementById('fTaiyari').value = scanned.taiyari;
              if (scanned.notes) document.getElementById('fNotes').value = scanned.notes;

              updateAutoDeityMatch();
              this.showToast('સ્કેન કરેલી બધી વિગતો આપમેળે ફોર્મમાં ભરાઈ ગઈ છે!');
            }
          });
        });

        // Form Submission
        const form = document.getElementById('serviceFullForm');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('formSubmitBtn');
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<span>સાચવી રહ્યા છીએ...</span>`;

          try {
            const formTitle = document.getElementById('fTitle').value.trim();
            const formCategory = document.getElementById('fCategory').value;

            // Determine final image URL
            let imageUrl = selectedDeityUrl || service?.thumbnailUrl || resolveDeityImage(formTitle, formCategory);

            if (fileInput.files && fileInput.files[0]) {
              imageUrl = await db.uploadImage(fileInput.files[0]);
            } else if (selectedGeneratedImage) {
              const safeTitle = (formTitle || 'pooja').replace(/[^a-zA-Z0-9\u0A80-\u0AFF]/g, '_');
              imageUrl = await db.uploadImage(selectedGeneratedImage, `card_${safeTitle}_${Date.now()}.jpg`);
            } else if (selectedDeityUrl) {
              imageUrl = selectedDeityUrl;
            }

            const rawKeywords = document.getElementById('fEnglishTitle').value.trim();
            const keywordsArray = rawKeywords
              .split(/[\s,]+/)
              .filter(Boolean)
              .map(k => k.toLowerCase());

            const data = {
              title: formTitle,
              englishTitle: document.getElementById('fEnglishTitle').value.trim(),
              category: formCategory,
              price: document.getElementById('fPrice').value.trim() || 'દક્ષિણા માટે સંપર્ક કરો',
              badge: document.getElementById('fBadge').value.trim() || 'ધાર્મિક વિધિ',
              thumbnailUrl: imageUrl,
              keywords: keywordsArray,
              pujapo: document.getElementById('fPujapo').value.trim(),
              anajNaivedya: document.getElementById('fAnaj').value.trim(),
              taiyari: document.getElementById('fTaiyari').value.trim(),
              notes: document.getElementById('fNotes').value.trim(),
              originalPamphlets: service?.originalPamphlets || []
            };

            if (isEdit) {
              await db.updateService(service.id, data);
              this.showToast('પૂજામાં ફેરફાર સફળતાપૂર્વક સાચવવામાં આવ્યા અને લાઈવ થઈ ગયા છે!');
            } else {
              await db.addService(data);
              this.showToast('નવી પૂજા સફળતાપૂર્વક ઉમેરવામાં આવી અને વેબસાઈટ પર લાઈવ થઈ ગઈ છે!');
            }

            this.activeTab = 'services';
            this.editingService = null;
            await this.renderDashboard();
          } catch (err) {
            console.error('Save error:', err);
            alert('સાચવવામાં સમસ્યા આવી: ' + err.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = `${ICONS.save} <span>ફરી પ્રયાસ કરો</span>`;
          }
        });
      }

      /* -------------------------------------------------------------
         ૫. "શાસ્ત્રીજી પ્રોફાઈલ" વ્યુ (Profile Management with SVG Icons)
         ------------------------------------------------------------- */
      async renderProfileView() {
        const workspace = document.getElementById('adminWorkspace');
        if (!workspace) return;

        const profile = await db.getProfile();

        workspace.innerHTML = `
          <div class="admin-form-full-wrap">
            <div class="admin-form-title-bar">
              <div>
                <h2 class="admin-form-main-heading" style="display: flex; align-items: center; gap: 0.55rem;">
                  ${ICONS.user}
                  <span>શાસ્ત્રીજી પ્રોફાઈલ અને સંપર્ક વિગત</span>
                </h2>
                <div class="admin-form-sub-heading">વેબસાઈટ અને પેમ્ફ્લેટ પર દર્શાવવા માટેની મુખ્ય શાસ્ત્રીજી વિગત</div>
              </div>
            </div>

            <form id="profileFullForm">
              <div class="admin-profile-full-grid">
                <div>
                  <div class="admin-fieldset-card">
                    <div style="margin-bottom: 1.25rem;">
                      <span class="admin-fieldset-legend">
                        ${ICONS.scroll}
                        <span>સંપર્ક અને પરિચય વિગત</span>
                      </span>
                    </div>

                    <div class="admin-form-group">
                      <label class="admin-form-label">શાસ્ત્રીજીનું પૂરું નામ *</label>
                      <input type="text" class="admin-form-input" id="pName" required value="${profile.name || ''}" placeholder="શાસ્ત્રીજી જીતેન્દ્ર જોષી (જીતુભાઈ જોષી)">
                    </div>

                    <div class="admin-form-row-2col">
                      <div class="admin-form-group">
                        <label class="admin-form-label">મોબાઈલ નંબર *</label>
                        <input type="text" class="admin-form-input" id="pPhone" required value="${profile.phone || ''}" placeholder="99252 64929">
                      </div>

                      <div class="admin-form-group">
                        <label class="admin-form-label">વોટ્સએપ નંબર *</label>
                        <input type="text" class="admin-form-input" id="pWhatsapp" required value="${profile.whatsapp || ''}" placeholder="99252 64929">
                      </div>
                    </div>

                    <div class="admin-form-group">
                      <label class="admin-form-label">વિશેષતા / આશીર્વચન સંદેશ</label>
                      <textarea class="admin-form-input" id="pSubtitle" placeholder="શ્રી ગણેશ કૃપા • કર્મકાંડ, જ્યોતિષ, વાસ્તુશાસ્ત્ર, કથા અને સર્વ પૂજા વિધાન">${profile.subtitle || ''}</textarea>
                    </div>
                  </div>
                </div>

                <div>
                  <div class="admin-profile-preview-card">
                    <div style="font-weight: 800; color: #8B1E0F; font-size: 1.1rem; margin-bottom: 1rem;">
                      શાસ્ત્રીજી સ્ટુડિયો ફોટો (Profile Photo)
                    </div>

                    <img src="${profile.avatarUrl || 'assets/images/shastriji-profile.jpg'}" id="profileAvatarPreview" class="admin-profile-avatar-circle" onerror="this.src='assets/icons/gemini-svg.svg'">

                    <label for="pPhotoFile" class="admin-btn-secondary" style="margin: 0 auto; display: inline-flex; cursor: pointer; gap: 0.45rem;">
                      ${ICONS.camera}
                      <span>નવો ફોટો પસંદ કરો</span>
                    </label>
                    <input type="file" accept="image/*" id="pPhotoFile" style="display: none;">
                    <div id="pPhotoNameDisplay" style="font-size: 0.82rem; color: #15803D; font-weight: 700; margin-top: 0.5rem;"></div>
                  </div>
                </div>
              </div>

              <div class="admin-form-actions-bottom-bar">
                <button type="submit" class="admin-btn-primary" id="saveProfileBtn" style="min-height: 50px; font-size: 1.05rem; padding: 0.65rem 2rem;">
                  ${ICONS.save}
                  <span>પ્રોફાઈલ સાચવો</span>
                </button>
              </div>
            </form>
          </div>
        `;

        const photoInput = document.getElementById('pPhotoFile');
        const photoPreview = document.getElementById('profileAvatarPreview');
        const photoName = document.getElementById('pPhotoNameDisplay');

        if (photoInput) {
          photoInput.addEventListener('change', () => {
            if (photoInput.files && photoInput.files[0]) {
              const file = photoInput.files[0];
              if (photoName) photoName.textContent = `પસંદ કરેલ ફોટો: ${file.name}`;
              const reader = new FileReader();
              reader.onload = (e) => {
                if (photoPreview) photoPreview.src = e.target.result;
              };
              reader.readAsDataURL(file);
            }
          });
        }

        const form = document.getElementById('profileFullForm');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('saveProfileBtn');
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<span>સાચવી રહ્યા છીએ...</span>`;

          try {
            let avatarUrl = profile.avatarUrl;
            if (photoInput.files && photoInput.files[0]) {
              avatarUrl = await db.uploadImage(photoInput.files[0]);
            }

            const updated = {
              name: document.getElementById('pName').value.trim(),
              phone: document.getElementById('pPhone').value.trim(),
              whatsapp: document.getElementById('pWhatsapp').value.trim(),
              subtitle: document.getElementById('pSubtitle').value.trim(),
              avatarUrl: avatarUrl
            };

            await db.updateProfile(updated);
            this.showToast('પ્રોફાઈલ સફળતાપૂર્વક અપડેટ કરવામાં આવી!');
            submitBtn.disabled = false;
            submitBtn.innerHTML = `${ICONS.save} <span>પ્રોફાઈલ સાચવો</span>`;
          } catch (err) {
            console.error('Profile update error:', err);
            alert('પ્રોફાઈલ સાચવવામાં સમસ્યા આવી: ' + err.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = `${ICONS.save} <span>ફરી પ્રયાસ કરો</span>`;
          }
        });
      }

      /* -------------------------------------------------------------
         ૬. "સુરક્ષા પિન" વ્યુ (Security PIN Management with SVG Icons)
         ------------------------------------------------------------- */
      async renderPinChangeView() {
        const workspace = document.getElementById('adminWorkspace');
        if (!workspace) return;

        workspace.innerHTML = `
          <div class="admin-form-full-wrap" style="max-width: 580px; margin: 0 auto;">
            <div class="admin-form-title-bar" style="text-align: center; justify-content: center;">
              <div>
                <h2 class="admin-form-main-heading" style="display: flex; align-items: center; justify-content: center; gap: 0.55rem;">
                  ${ICONS.key}
                  <span>સુરક્ષા પિન બદલો</span>
                </h2>
                <div class="admin-form-sub-heading">એડમિન કંટ્રોલ પેનલ માટે નવો ૪-અંકનો પાસવર્ડ પિન સેટ કરો</div>
              </div>
            </div>

            <form id="pinChangeForm" style="display: flex; flex-direction: column; gap: 1.25rem;">
              <div class="admin-form-group">
                <label class="admin-form-label">હાલનો પિન (Current PIN) *</label>
                <input type="password" maxlength="4" class="admin-form-input" id="curPin" required placeholder="હાલનો ૪ અંકનો પિન">
              </div>

              <div class="admin-form-group">
                <label class="admin-form-label">નવો પિન (New PIN) *</label>
                <input type="password" maxlength="4" class="admin-form-input" id="newPin" required placeholder="નવો ૪ અંકનો પિન">
              </div>

              <div class="admin-form-group">
                <label class="admin-form-label">નવો પિન ફરીથી દાખલ કરો *</label>
                <input type="password" maxlength="4" class="admin-form-input" id="confirmPin" required placeholder="નવો પિન કન્ફર્મ કરો">
              </div>

              <div id="pinChangeError" style="color: #DC2626; font-size: 0.92rem; font-weight: 700; text-align: center; min-height: 20px;"></div>

              <div style="display: flex; justify-content: center; margin-top: 0.5rem;">
                <button type="submit" class="admin-btn-primary" style="width: 100%; min-height: 50px; font-size: 1.05rem;">
                  ${ICONS.lock}
                  <span>નવો પિન સાચવો</span>
                </button>
              </div>
            </form>
          </div>
        `;

        const form = document.getElementById('pinChangeForm');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const curPin = document.getElementById('curPin').value.trim();
          const newPin = document.getElementById('newPin').value.trim();
          const confirmPin = document.getElementById('confirmPin').value.trim();
          const errEl = document.getElementById('pinChangeError');

          const profile = await db.getProfile();
          if (curPin !== (profile.pin || '1234')) {
            errEl.textContent = 'હાલનો પિન ખોટો છે!';
            return;
          }

          if (newPin.length !== 4 || isNaN(newPin)) {
            errEl.textContent = 'નવો પિન બરાબર ૪ અંકનો હોવો જોઈએ!';
            return;
          }

          if (newPin !== confirmPin) {
            errEl.textContent = 'બંને નવા પિન સરખા નથી!';
            return;
          }

          await db.updateProfile({ pin: newPin });
          this.showToast('સુરક્ષા પિન સફળતાપૂર્વક બદલાઈ ગયો છે!');
          this.activeTab = 'services';
          await this.renderDashboard();
        });
      }

      /* -------------------------------------------------------------
         ૭. પેમ્ફ્લેટ પ્રીવ્યૂ મોડલ (Quick Pamphlet Modal with Vector Icons)
         ------------------------------------------------------------- */
      openPreviewModal(service) {
        const overlay = document.getElementById('previewModalOverlay');
        const titleEl = document.getElementById('previewModalTitle');
        const bodyEl = document.getElementById('previewModalBody');
        if (!overlay || !titleEl || !bodyEl || !service) return;

        titleEl.innerHTML = `${ICONS.scroll} <span>પેમ્ફ્લેટ પ્રીવ્યૂ: ${service.title}</span>`;

        const pujapoList = (service.pujapo || '')
          .split(/[,;\n]+/)
          .map(i => i.trim())
          .filter(Boolean)
          .map(i => `<li style="padding: 0.3rem 0; color: #2D1A10; display: flex; align-items: flex-start; gap: 0.45rem;"><span style="color: #D97706; margin-top: 2px;">${ICONS.check}</span><span>${i}</span></li>`)
          .join('');

        bodyEl.innerHTML = `
          <div style="text-align: center; margin-bottom: 1.25rem;">
            <div style="font-size: 1.5rem; font-weight: 800; color: #8B1E0F;">${service.title}</div>
            <div style="font-size: 0.9rem; color: #6B5446; margin-top: 0.25rem;">વિભાગ: <strong>${service.category}</strong> • ${service.badge || 'ધાર્મિક વિધિ'}</div>
          </div>

          <div style="background: #FFFDF7; border: 1.5px solid #EAD8C2; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;">
            <div style="font-weight: 800; color: #8B1E0F; font-size: 1.05rem; margin-bottom: 0.5rem; border-bottom: 1px solid #FDE68A; padding-bottom: 0.35rem; display: flex; align-items: center; gap: 0.45rem;">
              ${ICONS.list}
              <span>૧. પૂજાપો / મુખ્ય સામગ્રી લિસ્ટ</span>
            </div>
            <ul style="list-style: none; padding: 0; margin: 0; line-height: 1.6;">
              ${pujapoList || '<li>સામગ્રી ઉપલબ્ધ નથી.</li>'}
            </ul>
          </div>

          ${service.anajNaivedya ? `
            <div style="background: #FFFDF7; border: 1.5px solid #EAD8C2; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;">
              <div style="font-weight: 800; color: #8B1E0F; font-size: 1.05rem; margin-bottom: 0.5rem; border-bottom: 1px solid #FDE68A; padding-bottom: 0.35rem; display: flex; align-items: center; gap: 0.45rem;">
                ${ICONS.diya}
                <span>૨. અનાજ અને નૈવેદ્ય</span>
              </div>
              <div style="color: #2D1A10; line-height: 1.6;">${service.anajNaivedya}</div>
            </div>
          ` : ''}

          ${service.taiyari ? `
            <div style="background: #FFFDF7; border: 1.5px solid #EAD8C2; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;">
              <div style="font-weight: 800; color: #8B1E0F; font-size: 1.05rem; margin-bottom: 0.5rem; border-bottom: 1px solid #FDE68A; padding-bottom: 0.35rem; display: flex; align-items: center; gap: 0.45rem;">
                ${ICONS.scroll}
                <span>૩. વાસણ અને ઘરની તૈયારી</span>
              </div>
              <div style="color: #2D1A10; line-height: 1.6;">${service.taiyari}</div>
            </div>
          ` : ''}

          <div style="text-align: center; margin-top: 1.5rem;">
            <button class="admin-btn-primary" onclick="window.print()" style="margin: 0 auto;">
              ${ICONS.printer}
              <span>પેમ્ફ્લેટ પ્રિન્ટ / સેવ કરો</span>
            </button>
          </div>
        `;

        overlay.style.display = 'flex';
      }
    }

    const admin = new StandaloneAdmin();
    admin.init();
  </script>
</body>
</html>
