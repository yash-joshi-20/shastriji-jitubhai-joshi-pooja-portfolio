<!DOCTYPE html>
<html lang="gu" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>શાસ્ત્રીજી જીતેન્દ્ર જોષી | એડમિન કંટ્રોલ પેનલ (CMS)</title>
  <meta name="theme-color" content="#8B1E0F">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/gemini-svg.svg">

  <!-- Google Fonts: Noto Sans Gujarati & Rozha One -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@300;400;500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">

  <!-- Client-Side OCR Engine (Zero AI / Zero LLM) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
</head>
<body class="admin-page-body">

  <!-- ૧. ફુલ-વિડ્થ ટોપબાર હેડર (Full-Width Sacred Sticky Header) -->
  <header class="admin-full-topbar">
    <div class="admin-full-topbar-inner">
      <a href="index.html" class="admin-brand-group" title="મુખ્ય વેબસાઈટ પર જાઓ">
        <div class="sacred-logo-ring admin-logo-ring">
          <img src="assets/icons/gemini-svg.svg" alt="શાસ્ત્રીજી ॐ લોગો" class="sacred-logo-img">
        </div>
        <div class="admin-brand-text">
          <span class="admin-brand-mantra">।। શ્રી ગણેશાય નમઃ ।।</span>
          <span class="admin-brand-title">શાસ્ત્રીજી જીતેન્દ્ર જોષી (જીતુભાઈ)</span>
          <span class="admin-brand-tag">🔒 સંચાલન પોર્ટલ (Admin CMS)</span>
        </div>
      </a>

      <div class="admin-header-actions">
        <div class="admin-server-status-pill" id="adminServerPill">
          <span class="admin-status-dot"></span>
          <span id="adminServerStatusText">લાઈવ સર્વર તપાસી રહ્યા છીએ...</span>
        </div>
        <a href="index.html" target="_blank" class="admin-view-site-link">
          <span>🌐 વેબસાઈટ જુઓ</span>
          <span aria-hidden="true">➔</span>
        </a>
        <button class="admin-top-logout-btn" id="topLogoutBtn" style="display: none;">
          <span>🚪 બહાર નીકળો</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ૨. મુખ્ય ફુલ-સ્ક્રીન કન્ટેનર (Full-Width Main Container) -->
  <main class="admin-full-main" id="adminMainArea">
    <!-- Rendered dynamically by StandaloneAdmin -->
  </main>

  <!-- ૩. ટોસ્ટ નોટિફિકેશન કન્ટેનર -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ૪. ક્વિક પેમ્ફ્લેટ પ્રીવ્યૂ મોડલ (Devotee Pamphlet Preview Modal) -->
  <div class="modal-overlay" id="previewModalOverlay" style="display: none; position: fixed; inset: 0; background: rgba(50, 10, 5, 0.7); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 1rem;">
    <div style="background: #FFFFFF; border: 2px solid #EAD8C2; border-radius: 20px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.75rem; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3);">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #FEF3C7; padding-bottom: 0.75rem; margin-bottom: 1.25rem;">
        <h3 id="previewModalTitle" style="font-size: 1.35rem; color: #8B1E0F; margin: 0; font-weight: 800;"></h3>
        <button type="button" id="closePreviewBtn" style="background: #FFFDF9; border: 1.5px solid #E2D0BA; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; font-weight: 700; color: #8B1E0F; display: flex; align-items: center; justify-content: center;">✕</button>
      </div>
      <div id="previewModalBody"></div>
    </div>
  </div>

  <!-- ૫. ફુલ-વિડ્થ ફૂટર (Footer) -->
  <footer class="admin-full-footer">
    <div style="display: flex; align-items: center; justify-content: center; gap: 0.65rem; margin-bottom: 0.4rem;">
      <div class="sacred-logo-ring" style="width: 28px; height: 28px; box-shadow: none; padding: 1.5px;">
        <img src="assets/icons/gemini-svg.svg" alt="ॐ લોગો" class="sacred-logo-img">
      </div>
      <div style="font-weight: 700; color: #8B1E0F; font-size: 0.95rem;">
        શાસ્ત્રીજી જીતેન્દ્ર જોષી પૂજા પોર્ટફોલિયો CMS
      </div>
    </div>
    <div style="color: #6B5446;">
      © 2026 શાસ્ત્રીજી જીતેન્દ્ર જોષી. સર્વાધિકાર સુરક્ષિત. • મોબાઈલ: ૯૯૨૫૨ ૬૪૯૨૯ • ગુજરાત
    </div>
  </footer>

  <!-- ૬. મોડ્યુલર જાવાસ્ક્રિપ્ટ લોજિક (Full UI/UX Pro Max Logic) -->
  <script type="module">
    import { db } from './js/db.js';
    import { CATEGORIES } from './js/data.js';
    import { mountCardGenerator } from './js/card-generator.js';
    import { openScannerModal } from './js/image-scanner.js';

    class StandaloneAdmin {
      constructor() {
        this.isAuthenticated = false;
        this.mainContainer = document.getElementById('adminMainArea');
        this.activeTab = 'services'; // 'services', 'add', 'profile', 'pin'
        this.editingService = null;
        this.searchQuery = '';
        this.categoryFilter = 'બધા વિભાગો';
        this.cachedServices = [];
      }

      async init() {
        this.checkServerStatus();

        if (sessionStorage.getItem('shastriji_admin_auth') === 'true') {
          this.isAuthenticated = true;
          document.getElementById('topLogoutBtn').style.display = 'inline-flex';
          document.getElementById('topLogoutBtn').onclick = () => this.logout();
          await this.renderDashboard();
        } else {
          this.renderPinScreen();
        }

        // Preview modal close handler
        const closeBtn = document.getElementById('closePreviewBtn');
        const overlay = document.getElementById('previewModalOverlay');
        if (closeBtn && overlay) {
          closeBtn.onclick = () => { overlay.style.display = 'none'; };
          overlay.onclick = (e) => { if (e.target === overlay) overlay.style.display = 'none'; };
        }
      }

      async checkServerStatus() {
        const pillText = document.getElementById('adminServerStatusText');
        try {
          const res = await fetch('/api/status', { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            if (pillText) pillText.textContent = `🟢 લાઈવ સર્વર (${data.servicesCount || 'ડેટા'} સક્રિય)`;
          } else {
            if (pillText) pillText.textContent = '🟠 સ્થાનિક સ્ટોરેજ સક્રિય';
          }
        } catch {
          if (pillText) pillText.textContent = '🟠 સ્થાનિક સ્ટોરેજ સક્રિય';
        }
      }

      showToast(message) {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<span>🙏</span> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      }

      logout() {
        this.isAuthenticated = false;
        sessionStorage.removeItem('shastriji_admin_auth');
        document.getElementById('topLogoutBtn').style.display = 'none';
        this.showToast('આપ સફળતાપૂર્વક લૉગ આઉટ થયા છો.');
        this.renderPinScreen();
      }

      /* -------------------------------------------------------------
         ૧. પિન લૉગિન સ્ક્રીન (Sacred PIN Authentication Screen)
         ------------------------------------------------------------- */
      renderPinScreen() {
        this.mainContainer.innerHTML = `
          <div class="admin-pin-view-wrapper">
            <div class="admin-pin-card">
              <div class="sacred-logo-ring admin-pin-logo-ring">
                <img src="assets/icons/gemini-svg.svg" alt="શાસ્ત્રીજી ॐ લોગો" class="sacred-logo-img">
              </div>
              <h2 class="admin-pin-title">શાસ્ત્રીજી સુરક્ષિત લૉગિન</h2>
              <p class="admin-pin-sub">કૃપા કરીને આપનો ૪-અંકનો ગુપ્ત પિન દાખલ કરો</p>

              <div class="admin-pin-boxes-row">
                <input type="password" maxlength="1" class="admin-pin-digit-input" id="pinDigit1" autofocus autocomplete="off" inputmode="numeric">
                <input type="password" maxlength="1" class="admin-pin-digit-input" id="pinDigit2" autocomplete="off" inputmode="numeric">
                <input type="password" maxlength="1" class="admin-pin-digit-input" id="pinDigit3" autocomplete="off" inputmode="numeric">
                <input type="password" maxlength="1" class="admin-pin-digit-input" id="pinDigit4" autocomplete="off" inputmode="numeric">
              </div>

              <div class="admin-pin-error" id="pinErrorMsg"></div>

              <button class="admin-pin-submit-btn" id="pinSubmitBtn">
                પ્રવેશ કરો ➔
              </button>

              <div style="margin-top: 1.25rem;">
                <span class="admin-pin-hint-tag">
                  💡 મૂળભૂત પિન: <strong>1234</strong> (લૉગિન પછી બદલી શકાય છે)
                </span>
              </div>
            </div>
          </div>
        `;

        const digits = [
          document.getElementById('pinDigit1'),
          document.getElementById('pinDigit2'),
          document.getElementById('pinDigit3'),
          document.getElementById('pinDigit4')
        ];

        digits.forEach((input, index) => {
          input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && index < 3) {
              digits[index + 1].focus();
            }
            if (digits.every(d => d.value.length === 1)) {
              this.verifyPin(digits.map(d => d.value).join(''));
            }
          });

          input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && index > 0) {
              digits[index - 1].focus();
            }
          });

          // Paste support (e.g. pasting "1234")
          input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = (e.clipboardData || window.clipboardData).getData('text').trim();
            if (pastedData.length >= 4) {
              digits.forEach((d, i) => { if (d) d.value = pastedData[i] || ''; });
              this.verifyPin(digits.map(d => d.value).join(''));
            }
          });
        });

        document.getElementById('pinSubmitBtn')?.addEventListener('click', () => {
          const pin = digits.map(d => d.value).join('');
          this.verifyPin(pin);
        });
      }

      async verifyPin(enteredPin) {
        const errorEl = document.getElementById('pinErrorMsg');
        const profile = await db.getProfile();
        const correctPin = profile.pin || '1234';

        if (enteredPin === correctPin) {
          this.isAuthenticated = true;
          sessionStorage.setItem('shastriji_admin_auth', 'true');
          document.getElementById('topLogoutBtn').style.display = 'inline-flex';
          document.getElementById('topLogoutBtn').onclick = () => this.logout();
          this.showToast('સ્વાગત છે શાસ્ત્રીજી! લૉગિન સફળ રહ્યું.');
          await this.renderDashboard();
        } else {
          if (errorEl) {
            errorEl.innerHTML = '<span>❌ ખોટો પિન! કૃપા કરીને ફરી પ્રયાસ કરો.</span>';
          }
          const digits = ['pinDigit1', 'pinDigit2', 'pinDigit3', 'pinDigit4'].map(id => document.getElementById(id));
          digits.forEach(d => { if (d) d.value = ''; });
          if (digits[0]) digits[0].focus();
        }
      }

      /* -------------------------------------------------------------
         ૨. મુખ્ય ડેશબોર્ડ શેલ (Metrics Ribbon, Tabs, Workspace)
         ------------------------------------------------------------- */
      async renderDashboard() {
        this.cachedServices = await db.getServices();

        // Calculate metrics
        const totalServices = this.cachedServices.length;
        const uniqueCategories = new Set(this.cachedServices.map(s => s.category)).size;
        const totalItemsCount = this.cachedServices.reduce((acc, s) => {
          const items = (s.pujapo || '').split(/[,;\n]+/).filter(Boolean).length;
          return acc + items;
        }, 0);

        this.mainContainer.innerHTML = `
          <!-- ટોપ મેટ્રિક્સ રિબન (Top Metrics Ribbon) -->
          <div class="admin-metrics-ribbon">
            <div class="admin-metric-card">
              <div class="admin-metric-icon">🪔</div>
              <div>
                <div class="admin-metric-value">${totalServices} પૂજાઓ</div>
                <div class="admin-metric-label">કુલ સક્રિય યાદી</div>
              </div>
            </div>

            <div class="admin-metric-card">
              <div class="admin-metric-icon">🏷️</div>
              <div>
                <div class="admin-metric-value">${uniqueCategories} શ્રેણીઓ</div>
                <div class="admin-metric-label">કર્મકાંડ, શાંતિ, વ્રત</div>
              </div>
            </div>

            <div class="admin-metric-card">
              <div class="admin-metric-icon">📜</div>
              <div>
                <div class="admin-metric-value">${totalItemsCount}+ વસ્તુઓ</div>
                <div class="admin-metric-label">શાસ્ત્રોક્ત સામગ્રી લિસ્ટ</div>
              </div>
            </div>

            <div class="admin-metric-card">
              <div class="admin-metric-icon">💾</div>
              <div>
                <div class="admin-metric-value">૧૦૦% સુરક્ષિત</div>
                <div class="admin-metric-label">સર્વર + ઑટો-બેકઅપ</div>
              </div>
            </div>
          </div>

          <!-- નેવિગેશન ટેબ્સ બાર (Sleek Tabs, Zero Scrollbar) -->
          <div class="admin-tabs-nav-bar">
            <button class="admin-tab-nav-btn ${this.activeTab === 'services' ? 'active' : ''}" id="tabServicesBtn">
              <span>📋</span> <span>બધી પૂજાઓ (${totalServices})</span>
            </button>
            <button class="admin-tab-nav-btn ${this.activeTab === 'add' ? 'active' : ''}" id="tabAddBtn">
              <span>➕</span> <span>નવી પૂજા ઉમેરો</span>
            </button>
            <button class="admin-tab-nav-btn ${this.activeTab === 'profile' ? 'active' : ''}" id="tabProfileBtn">
              <span>👤</span> <span>શાસ્ત્રીજી પ્રોફાઈલ</span>
            </button>
            <button class="admin-tab-nav-btn ${this.activeTab === 'pin' ? 'active' : ''}" id="tabPinBtn">
              <span>🔑</span> <span>સુરક્ષા પિન બદલો</span>
            </button>
          </div>

          <!-- વર્કસ્પેસ કન્ટેન્ટ એરિયા -->
          <div id="adminWorkspace"></div>
        `;

        // Wire Tab Clicks
        document.getElementById('tabServicesBtn')?.addEventListener('click', () => {
          this.activeTab = 'services';
          this.editingService = null;
          this.updateTabStyles();
          this.renderServicesView();
        });

        document.getElementById('tabAddBtn')?.addEventListener('click', () => {
          this.activeTab = 'add';
          this.editingService = null;
          this.updateTabStyles();
          this.renderAddEditView(null);
        });

        document.getElementById('tabProfileBtn')?.addEventListener('click', () => {
          this.activeTab = 'profile';
          this.updateTabStyles();
          this.renderProfileView();
        });

        document.getElementById('tabPinBtn')?.addEventListener('click', () => {
          this.activeTab = 'pin';
          this.updateTabStyles();
          this.renderPinChangeView();
        });

        // Initial view load
        if (this.activeTab === 'services') {
          await this.renderServicesView();
        } else if (this.activeTab === 'add') {
          await this.renderAddEditView(this.editingService);
        } else if (this.activeTab === 'profile') {
          await this.renderProfileView();
        } else if (this.activeTab === 'pin') {
          await this.renderPinChangeView();
        }
      }

      updateTabStyles() {
        const btnMap = {
          services: 'tabServicesBtn',
          add: 'tabAddBtn',
          profile: 'tabProfileBtn',
          pin: 'tabPinBtn'
        };
        Object.entries(btnMap).forEach(([tab, btnId]) => {
          const btn = document.getElementById(btnId);
          if (btn) {
            if (this.activeTab === tab) btn.classList.add('active');
            else btn.classList.remove('active');
          }
        });
      }

      /* -------------------------------------------------------------
         ૩. "બધી પૂજાઓ" વ્યુ (All Services View - Full Responsive Grid)
         ------------------------------------------------------------- */
      async renderServicesView() {
        const workspace = document.getElementById('adminWorkspace');
        if (!workspace) return;

        this.cachedServices = await db.getServices();

        // Unique categories for filter dropdown
        const categories = ['બધા વિભાગો', ...new Set(this.cachedServices.map(s => s.category).filter(Boolean))];
        const catOptions = categories
          .map(cat => `<option value="${cat}" ${this.categoryFilter === cat ? 'selected' : ''}>${cat}</option>`)
          .join('');

        // Apply filters
        const filtered = this.cachedServices.filter(s => {
          const matchesCategory = (this.categoryFilter === 'બધા વિભાગો') || (s.category === this.categoryFilter);
          const q = this.searchQuery.toLowerCase().trim();
          if (!q) return matchesCategory;

          const title = (s.title || '').toLowerCase();
          const engTitle = (s.englishTitle || '').toLowerCase();
          const pujapo = (s.pujapo || '').toLowerCase();
          const keywords = Array.isArray(s.keywords) ? s.keywords.join(' ').toLowerCase() : '';

          const matchesQuery = title.includes(q) || engTitle.includes(q) || pujapo.includes(q) || keywords.includes(q);
          return matchesCategory && matchesQuery;
        });

        let gridHtml = '';

        if (filtered.length === 0) {
          gridHtml = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 3.5rem 1.5rem; background: #FFFFFF; border: 1.5px dashed #EAD8C2; border-radius: 18px;">
              <div style="font-size: 3rem; margin-bottom: 0.75rem;">🔍</div>
              <h3 style="font-size: 1.3rem; color: #8B1E0F; margin-bottom: 0.35rem;">કોઈ પૂજા મળી નહીં</h3>
              <p style="color: #6B5446; font-size: 0.95rem; margin-bottom: 1.25rem;">
                ${this.searchQuery ? `"${this.searchQuery}" માટે કોઈ પરિણામ મળ્યું નથી.` : 'હજી કોઈ પૂજા ઉમેરેલ નથી.'}
              </p>
              <button class="admin-btn-primary" id="emptyAddNewBtn" style="margin: 0 auto;">
                <span>➕ નવી પૂજા ઉમેરો</span>
              </button>
            </div>
          `;
        } else {
          gridHtml = filtered.map(item => {
            const samagriCount = (item.pujapo || '').split(/[,;\n]+/).filter(Boolean).length;
            const thumb = item.thumbnailUrl || 'assets/images/card-ganesh.png';
            const price = item.price || 'દક્ષિણા માટે સંપર્ક કરો';
            const badge = item.badge || 'ધાર્મિક વિધિ';
            const engTitle = item.englishTitle || '';

            return `
              <div class="admin-srv-card-new">
                <div class="admin-srv-card-top">
                  <div class="admin-srv-thumb-box">
                    <img src="${thumb}" alt="${item.title}" class="admin-srv-thumb-img" onerror="this.src='assets/icons/gemini-svg.svg'">
                  </div>

                  <div class="admin-srv-meta-col">
                    <div class="admin-srv-tags-row">
                      <span class="admin-tag-category">🏷️ ${item.category}</span>
                      <span class="admin-tag-badge">⭐ ${badge}</span>
                    </div>
                    <div class="admin-srv-title-text">${item.title}</div>
                    ${engTitle ? `<div class="admin-srv-english-text">${engTitle}</div>` : ''}
                    <div class="admin-srv-price-text">
                      <span>💰</span> <span>${price}</span>
                    </div>
                  </div>
                </div>

                <div class="admin-srv-card-middle">
                  <div class="admin-srv-samagri-count">
                    <span>📋 શાસ્ત્રોક્ત સામગ્રી:</span> <span>${samagriCount} વસ્તુઓ</span>
                  </div>
                  <div style="font-size: 0.82rem; color: #8C7A6B; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">

              if (previewBox) previewBox.style.display = 'flex';
              if (previewStatus) previewStatus.textContent = '✨ દિવ્ય જનરેટ કરેલ ફોટો પસંદ થયો!';
              if (fileNameDisplay) fileNameDisplay.textContent = 'કેનવાસ કાર્ડ મુખ્ય ફોટો તરીકે સેટ થયું.';
              this.showToast('✨ દિવ્ય કાર્ડ મુખ્ય ફોટો તરીકે સેટ થઈ ગયું!');
            }
          }
        );

        // Sync Title input with live card generator
        const fTitleEl = document.getElementById('fTitle');
        const fCategoryEl = document.getElementById('fCategory');
        if (fTitleEl && cardGenHandle) {
          fTitleEl.addEventListener('input', (e) => cardGenHandle.setTitle(e.target.value));
        }
        if (fCategoryEl && cardGenHandle) {
          fCategoryEl.addEventListener('change', (e) => cardGenHandle.setCategory(e.target.value));
        }

        // Wire Scanner Button
        document.getElementById('fOpenScannerBtn')?.addEventListener('click', () => {
          openScannerModal({
            onApply: (scanned) => {
              if (scanned.title) {
                fTitleEl.value = scanned.title;
                if (cardGenHandle) cardGenHandle.setTitle(scanned.title);
              }
              if (scanned.category) {
                fCategoryEl.value = scanned.category;
                if (cardGenHandle) cardGenHandle.setCategory(scanned.category);
              }
              if (scanned.price) document.getElementById('fPrice').value = scanned.price;
              if (scanned.pujapo) document.getElementById('fPujapo').value = scanned.pujapo;
              if (scanned.anajNaivedya) document.getElementById('fAnaj').value = scanned.anajNaivedya;
              if (scanned.taiyari) document.getElementById('fTaiyari').value = scanned.taiyari;
              if (scanned.notes) document.getElementById('fNotes').value = scanned.notes;

              this.showToast('🙏 સ્કેન કરેલી બધી વિગતો આપમેળે ફોર્મમાં ભરાઈ ગઈ છે!');
            }
          });
        });

        // Form Submission
        const form = document.getElementById('serviceFullForm');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('formSubmitBtn');
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span>⏳ સાચવી રહ્યા છીએ...</span>';

          try {
            let imageUrl = service?.thumbnailUrl || 'assets/images/card-ganesh.png';

            if (fileInput.files && fileInput.files[0]) {
              imageUrl = await db.uploadImage(fileInput.files[0]);
            } else if (selectedGeneratedImage) {
              const safeTitle = (document.getElementById('fTitle').value.trim() || 'pooja').replace(/[^a-zA-Z0-9\u0A80-\u0AFF]/g, '_');
              imageUrl = await db.uploadImage(selectedGeneratedImage, `card_${safeTitle}_${Date.now()}.jpg`);
            }

            const rawKeywords = document.getElementById('fEnglishTitle').value.trim();
            const keywordsArray = rawKeywords
              .split(/[\s,]+/)
              .filter(Boolean)
              .map(k => k.toLowerCase());

            const data = {
              title: document.getElementById('fTitle').value.trim(),
              englishTitle: document.getElementById('fEnglishTitle').value.trim(),
              category: document.getElementById('fCategory').value,
              price: document.getElementById('fPrice').value.trim() || 'દક્ષિણા માટે સંપર્ક કરો',
              badge: document.getElementById('fBadge').value.trim() || 'ધાર્મિક વિધિ',
              thumbnailUrl: imageUrl,
              keywords: keywordsArray,
              pujapo: document.getElementById('fPujapo').value.trim(),
              anajNaivedya: document.getElementById('fAnaj').value.trim(),
              taiyari: document.getElementById('fTaiyari').value.trim(),
              notes: document.getElementById('fNotes').value.trim(),
              originalPamphlets: service?.originalPamphlets || []
            };

            if (isEdit) {
              await db.updateService(service.id, data);
              this.showToast('પૂજામાં ફેરફાર સફળતાપૂર્વક સાચવવામાં આવ્યા!');
            } else {
              await db.addService(data);
              this.showToast('નવી પૂજા સફળતાપૂર્વક ઉમેરવામાં આવી!');
            }

            this.activeTab = 'services';
            this.editingService = null;
            await this.renderDashboard();
          } catch (err) {
            console.error('Save error:', err);
            alert('સાચવવામાં સમસ્યા આવી: ' + err.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>ફરી પ્રયાસ કરો</span>';
          }
        });
      }

      /* -------------------------------------------------------------
         ૫. "શાસ્ત્રીજી પ્રોફાઈલ" વ્યુ (Profile Management)
         ------------------------------------------------------------- */
      async renderProfileView() {
        const workspace = document.getElementById('adminWorkspace');
        if (!workspace) return;

        const profile = await db.getProfile();

        workspace.innerHTML = `
          <div class="admin-form-full-wrap">
            <div class="admin-form-title-bar">
              <div>
                <h2 class="admin-form-main-heading">👤 શાસ્ત્રીજી પ્રોફાઈલ અને સંપર્ક વિગત</h2>
                <div class="admin-form-sub-heading">વેબસાઈટ અને પેમ્ફ્લેટ પર દર્શાવવા માટેની મુખ્ય શાસ્ત્રીજી વિગત</div>
              </div>
            </div>

            <form id="profileFullForm">
              <div class="admin-profile-full-grid">
                <div>
                  <div class="admin-fieldset-card">
                    <div style="margin-bottom: 1.25rem;">
                      <span class="admin-fieldset-legend">સંપર્ક અને પરિચય વિગત</span>
                    </div>

                    <div class="admin-form-group">
                      <label class="admin-form-label">શાસ્ત્રીજીનું પૂરું નામ *</label>
                      <input type="text" class="admin-form-input" id="pName" required value="${profile.name || ''}" placeholder="શાસ્ત્રીજી જીતેન્દ્ર જોષી (જીતુભાઈ જોષી)">
                    </div>

                    <div class="admin-form-row-2col">
                      <div class="admin-form-group">
                        <label class="admin-form-label">મોબાઈલ નંબર *</label>
                        <input type="text" class="admin-form-input" id="pPhone" required value="${profile.phone || ''}" placeholder="99252 64929">
                      </div>

                      <div class="admin-form-group">
                        <label class="admin-form-label">વોટ્સએપ નંબર *</label>
                        <input type="text" class="admin-form-input" id="pWhatsapp" required value="${profile.whatsapp || ''}" placeholder="99252 64929">
                      </div>
                    </div>

                    <div class="admin-form-group">
                      <label class="admin-form-label">વિશેષતા / આશીર્વચન સંદેશ</label>
                      <textarea class="admin-form-input" id="pSubtitle" placeholder="શ્રી ગણેશ કૃપા • કર્મકાંડ, જ્યોતિષ, વાસ્તુશાસ્ત્ર, કથા અને સર્વ પૂજા વિધાન">${profile.subtitle || ''}</textarea>
                    </div>
                  </div>
                </div>

                <div>
                  <div class="admin-profile-preview-card">
                    <div style="font-weight: 800; color: #8B1E0F; font-size: 1.1rem; margin-bottom: 1rem;">
                      શાસ્ત્રીજી સ્ટુડિયો ફોટો (Profile Photo)
                    </div>

                    <img src="${profile.avatarUrl || 'assets/images/shastriji-profile.jpg'}" id="profileAvatarPreview" class="admin-profile-avatar-circle" onerror="this.src='assets/icons/gemini-svg.svg'">

                    <label for="pPhotoFile" class="admin-btn-secondary" style="margin: 0 auto; display: inline-flex; cursor: pointer;">
                      <span>📷 નવો ફોટો પસંદ કરો</span>
                    </label>
                    <input type="file" accept="image/*" id="pPhotoFile" style="display: none;">
                    <div id="pPhotoNameDisplay" style="font-size: 0.82rem; color: #15803D; font-weight: 700; margin-top: 0.5rem;"></div>
                  </div>
                </div>
              </div>

              <div class="admin-form-actions-bottom-bar">
                <button type="submit" class="admin-btn-primary" id="saveProfileBtn" style="min-height: 50px; font-size: 1.05rem; padding: 0.65rem 2rem;">
                  <span>💾 પ્રોફાઈલ સાચવો</span>
                </button>
              </div>
            </form>
          </div>
        `;

        const photoInput = document.getElementById('pPhotoFile');
        const photoPreview = document.getElementById('profileAvatarPreview');
        const photoName = document.getElementById('pPhotoNameDisplay');

        if (photoInput) {
          photoInput.addEventListener('change', () => {
            if (photoInput.files && photoInput.files[0]) {
              const file = photoInput.files[0];
              if (photoName) photoName.textContent = `પસંદ કરેલ ફોટો: ${file.name}`;
              const reader = new FileReader();
              reader.onload = (e) => {
                if (photoPreview) photoPreview.src = e.target.result;
              };
              reader.readAsDataURL(file);
            }
          });
        }

        const form = document.getElementById('profileFullForm');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('saveProfileBtn');
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span>⏳ સાચવી રહ્યા છીએ...</span>';

          try {
            let avatarUrl = profile.avatarUrl;
            if (photoInput.files && photoInput.files[0]) {
              avatarUrl = await db.uploadImage(photoInput.files[0]);
            }

            const updated = {
              name: document.getElementById('pName').value.trim(),
              phone: document.getElementById('pPhone').value.trim(),
              whatsapp: document.getElementById('pWhatsapp').value.trim(),
              subtitle: document.getElementById('pSubtitle').value.trim(),
              avatarUrl: avatarUrl
            };

            await db.updateProfile(updated);
            this.showToast('પ્રોફાઈલ સફળતાપૂર્વક અપડેટ કરવામાં આવી!');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>💾 પ્રોફાઈલ સાચવો</span>';
          } catch (err) {
            console.error('Profile update error:', err);
            alert('પ્રોફાઈલ સાચવવામાં સમસ્યા આવી: ' + err.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>ફરી પ્રયાસ કરો</span>';
          }
        });
      }

      /* -------------------------------------------------------------
         ૬. "સુરક્ષા પિન" વ્યુ (Security PIN Management)
         ------------------------------------------------------------- */
      async renderPinChangeView() {
        const workspace = document.getElementById('adminWorkspace');
        if (!workspace) return;

        workspace.innerHTML = `
          <div class="admin-form-full-wrap" style="max-width: 580px; margin: 0 auto;">
            <div class="admin-form-title-bar" style="text-align: center; justify-content: center;">
              <div>
                <h2 class="admin-form-main-heading">🔑 સુરક્ષા પિન બદલો</h2>
                <div class="admin-form-sub-heading">એડમિન કંટ્રોલ પેનલ માટે નવો ૪-અંકનો પાસવર્ડ પિન સેટ કરો</div>
              </div>
            </div>

            <form id="pinChangeForm" style="display: flex; flex-direction: column; gap: 1.25rem;">
              <div class="admin-form-group">
                <label class="admin-form-label">હાલનો પિન (Current PIN) *</label>
                <input type="password" maxlength="4" class="admin-form-input" id="curPin" required placeholder="હાલનો ૪ અંકનો પિન">
              </div>

              <div class="admin-form-group">
                <label class="admin-form-label">નવો પિન (New PIN) *</label>
                <input type="password" maxlength="4" class="admin-form-input" id="newPin" required placeholder="નવો ૪ અંકનો પિન">
              </div>

              <div class="admin-form-group">
                <label class="admin-form-label">નવો પિન ફરીથી દાખલ કરો *</label>
                <input type="password" maxlength="4" class="admin-form-input" id="confirmPin" required placeholder="નવો પિન કન્ફર્મ કરો">
              </div>

              <div id="pinChangeError" style="color: #DC2626; font-size: 0.92rem; font-weight: 700; text-align: center; min-height: 20px;"></div>

              <div style="display: flex; justify-content: center; margin-top: 0.5rem;">
                <button type="submit" class="admin-btn-primary" style="width: 100%; min-height: 50px; font-size: 1.05rem;">
                  <span>💾 નવો પિન સાચવો</span>
                </button>
              </div>
            </form>
          </div>
        `;

        const form = document.getElementById('pinChangeForm');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const curPin = document.getElementById('curPin').value.trim();
          const newPin = document.getElementById('newPin').value.trim();
          const confirmPin = document.getElementById('confirmPin').value.trim();
          const errEl = document.getElementById('pinChangeError');

          const profile = await db.getProfile();
          if (curPin !== (profile.pin || '1234')) {
            errEl.textContent = '❌ હાલનો પિન ખોટો છે!';
            return;
          }

          if (newPin.length !== 4 || isNaN(newPin)) {
            errEl.textContent = '❌ નવો પિન બરાબર ૪ અંકનો હોવો જોઈએ!';
            return;
          }

          if (newPin !== confirmPin) {
            errEl.textContent = '❌ બંને નવા પિન સરખા નથી!';
            return;
          }

          await db.updateProfile({ pin: newPin });
          this.showToast('સુરક્ષા પિન સફળતાપૂર્વક બદલાઈ ગયો છે!');
          this.activeTab = 'services';
          await this.renderDashboard();
        });
      }

      /* -------------------------------------------------------------
         ૭. પેમ્ફ્લેટ પ્રીવ્યૂ મોડલ (Quick Pamphlet Modal)
         ------------------------------------------------------------- */
      openPreviewModal(service) {
        const overlay = document.getElementById('previewModalOverlay');
        const titleEl = document.getElementById('previewModalTitle');
        const bodyEl = document.getElementById('previewModalBody');
        if (!overlay || !titleEl || !bodyEl || !service) return;

        titleEl.textContent = `📜 પેમ્ફ્લેટ પ્રીવ્યૂ: ${service.title}`;

        const pujapoList = (service.pujapo || '')
          .split(/[,;\n]+/)
          .map(i => i.trim())
          .filter(Boolean)
          .map(i => `<li style="padding: 0.25rem 0; color: #2D1A10;">${i}</li>`)
          .join('');

        bodyEl.innerHTML = `
          <div style="text-align: center; margin-bottom: 1.25rem;">
            <div style="font-size: 1.5rem; font-weight: 800; color: #8B1E0F;">${service.title}</div>
            <div style="font-size: 0.9rem; color: #6B5446; margin-top: 0.25rem;">વિભાગ: <strong>${service.category}</strong> • ${service.badge || 'ધાર્મિક વિધિ'}</div>
          </div>

          <div style="background: #FFFDF7; border: 1.5px solid #EAD8C2; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;">
            <div style="font-weight: 800; color: #8B1E0F; font-size: 1.05rem; margin-bottom: 0.5rem; border-bottom: 1px solid #FDE68A; padding-bottom: 0.35rem;">
              ૧. પૂજાપો / મુખ્ય સામગ્રી લિસ્ટ
            </div>
            <ul style="padding-left: 1.25rem; margin: 0; line-height: 1.6;">
              ${pujapoList || '<li>સામગ્રી ઉપલબ્ધ નથી.</li>'}
            </ul>
          </div>

          ${service.anajNaivedya ? `
            <div style="background: #FFFDF7; border: 1.5px solid #EAD8C2; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;">
              <div style="font-weight: 800; color: #8B1E0F; font-size: 1.05rem; margin-bottom: 0.5rem; border-bottom: 1px solid #FDE68A; padding-bottom: 0.35rem;">
                ૨. અનાજ અને નૈવેદ્ય
              </div>
              <div style="color: #2D1A10; line-height: 1.6;">${service.anajNaivedya}</div>
            </div>
          ` : ''}

          ${service.taiyari ? `
            <div style="background: #FFFDF7; border: 1.5px solid #EAD8C2; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;">
              <div style="font-weight: 800; color: #8B1E0F; font-size: 1.05rem; margin-bottom: 0.5rem; border-bottom: 1px solid #FDE68A; padding-bottom: 0.35rem;">
                ૩. વાસણ અને ઘરની તૈયારી
              </div>
              <div style="color: #2D1A10; line-height: 1.6;">${service.taiyari}</div>
            </div>
          ` : ''}

          <div style="text-align: center; margin-top: 1.5rem;">
            <button class="admin-btn-primary" onclick="window.print()" style="margin: 0 auto;">
              <span>🖨️ પેમ્ફ્લેટ પ્રિન્ટ / સેવ કરો</span>
            </button>
          </div>
        `;

        overlay.style.display = 'flex';
      }
    }

    const admin = new StandaloneAdmin();
    admin.init();
  </script>
</body>
</html>
